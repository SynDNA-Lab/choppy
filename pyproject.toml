[tool.poetry]
name = "choppy"
version = "0.1.0"
description = "Cut a sequence into pieces with hanging overlaps"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["bioinformatics", "DNA", "TAR cloning", "homology", "recombination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
homepage = "https://github.com/SynDNA-Lab/choppy"
repository = "https://github.com/SynDNA-Lab/choppy"
documentation = "https://github.com/SynDNA-Lab/choppy"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.5.4"
marisa-trie = "^1.4.1"
biopython = "^1.88"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
